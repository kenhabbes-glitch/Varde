# Utgangspunkt for nRF9151. Leverandøren fullfører.
CONFIG_NEWLIB_LIBC=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y

# Modem: LTE-M og NB-IoT, NTN når tilgjengelig i SDK
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y

# Oppdateringer (kapittel om programvare og oppdateringer)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FOTA_DOWNLOAD=y
CONFIG_DFU_TARGET=y

# Sikker kommunikasjon
CONFIG_NET_SOCKETS=y
CONFIG_MODEM_KEY_MGMT=y

# I2C for ATECC608B, IMU, lyssensor; SPI for CAN-kontroller og LoRa
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
