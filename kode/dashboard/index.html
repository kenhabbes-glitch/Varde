<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varde – mottak</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --mut:#6b6a66; --line:#e3e1dc; --red:#b3261e; --amb:#b26a00; --grn:#2e7d32; --blu:#1f5fa8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe7; --mut:#9b9a95; --line:#33322f; --red:#ef6b62; --amb:#e0a040; --grn:#6cc070; --blu:#7aa8e0; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  input, select, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { cursor:pointer; } button.pri { background:var(--ink); color:var(--card); border-color:var(--ink); }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:0; padding:10px 14px; border-bottom:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--mut); font-size:12px; }
  .st { font-weight:600; } .Normal { color:var(--grn); } .Forsinket { color:var(--amb); } .Mistenkelig { color:var(--amb); } .Alarm { color:var(--red); }
  .case { padding:10px 14px; border-bottom:1px solid var(--line); } .case.p1 { border-left:4px solid var(--red); } .case.p2, .case.p3 { border-left:4px solid var(--amb); }
  .case.closed { opacity:.55; border-left-color:var(--line); }
  .case .t { font-weight:600; } .mut { color:var(--mut); font-size:12px; }
  .case .act { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; }
  #log { max-height:260px; overflow:auto; font-size:12px; padding:6px 14px; } #log div { padding:2px 0; border-bottom:1px dotted var(--line); }
  #conn { font-size:12px; } .on { color:var(--grn); } .off { color:var(--red); }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>Varde – mottak og håndtering</h1>
  <label>Navn <input id="who" value="Operatør" size="12"></label>
  <label>Token <input id="token" type="password" value="" placeholder="operatør-token" size="12"></label>
  <button class="pri" id="connect">Kople til</button>
  <span id="conn" class="off">Ikke tilkoplet</span>
</header>
<main>
  <section>
    <h2>Alarmkø</h2>
    <div id="cases"><div class="case mut">Ingen saker.</div></div>
  </section>
  <section>
    <h2>Enheter</h2>
    <table><thead><tr><th>Enhet</th><th>Anlegg</th><th>Tilstand</th><th>Kanal</th><th>Posisjon</th><th>Miljø</th><th>Sist hørt</th></tr></thead><tbody id="units"></tbody></table>
  </section>
  <section class="full">
    <h2>Logg</h2>
    <div id="log"></div>
  </section>
</main>
<script>
// Første versjon av dashboardet. Ren JavaScript uten byggesteg.
// Leverandøren lager full versjon i React/TypeScript etter designdokumentet.
const $ = id => document.getElementById(id);
const units = new Map(), cases = new Map();
let es, seenHello = false;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const tm = t => new Date(t * 1000).toLocaleTimeString('no-NO');
const ago = t => { const s = Math.max(0, Math.round(Date.now() / 1000 - t)); return s < 60 ? `${s} s` : `${Math.round(s / 60)} min`; };
const hdr = () => ({ authorization: 'Bearer ' + $('token').value, 'content-type': 'application/json' });

async function get(p) { const r = await fetch(p, { headers: hdr() }); if (!r.ok) throw new Error((await r.json()).error || r.status); return r.json(); }
async function post(p, b) { const r = await fetch(p, { method: 'POST', headers: hdr(), body: JSON.stringify(b) }); const j = await r.json(); if (!r.ok) alertBox(j.error); return j; }
function alertBox(t) { addLog({ t: Date.now() / 1000, text: 'Feil: ' + t }); }

function renderUnits() {
  const rows = [...units.values()].sort((a, b) => a.site.localeCompare(b.site) || a.name.localeCompare(b.name));
  $('units').innerHTML = rows.map(u => `<tr>
    <td>${esc(u.name)}<div class="mut">${esc(u.id)}</div></td><td>${esc(u.site)}</td>
    <td><span class="st ${esc(u.state)}">${esc(u.state)}</span>${u.reason ? `<div class="mut">${esc(u.reason)}</div>` : ''}</td>
    <td>${esc(u.channel)}${u.noise ? ' <span class="mut">støy</span>' : ''}</td>
    <td>${geoText(u)}</td>
    <td><select data-env="${esc(u.id)}">${['skog','landlig','by'].map(e => `<option ${e === u.env ? 'selected' : ''}>${e}</option>`).join('')}</select></td>
    <td class="mut">${ago(u.lastSeen)}</td></tr>`).join('') || '<tr><td colspan="7" class="mut">Ingen enheter.</td></tr>';
}
// Geofence: inne / usikker / ute, med avstand til gjerdet.
function geoText(u) {
  if (!u.geo || u.geo === 'ukjent') return '<span class="mut">–</span>';
  const cls = u.geo === 'ute' ? 'Alarm' : u.geo === 'usikker' ? 'Forsinket' : 'Normal';
  const d = u.geo === 'inne' ? '' : ` <span class="mut">${u.geoDistM} m ute</span>`;
  return `<span class="st ${cls}">${esc(u.geo)}</span>${d}`;
}
function renderCases() {
  const list = [...cases.values()].sort((a, b) => (a.state === 'Avsluttet') - (b.state === 'Avsluttet') || a.prio - b.prio || b.created - a.created);
  $('cases').innerHTML = list.map(c => {
    const u = units.get(c.unitId);
    const open = c.state !== 'Avsluttet';
    return `<div class="case p${c.prio} ${open ? '' : 'closed'}">
      <div class="t">${esc(c.id)} · ${esc(u?.name || c.unitId)} · ${esc(c.title)}</div>
      <div class="mut">Prioritet ${c.prio} · ${esc(c.code)} · ${esc(c.state)}${c.owner ? ' · ' + esc(c.owner) : ''} · ${tm(c.created)}${c.result ? ' · ' + esc(c.result) : ''}</div>
      <div class="mut">${c.events.map(e => `${tm(e.t)} ${esc(e.text)}`).join('<br>')}</div>
      ${open ? `<div class="act">
        ${c.state === 'Ny' ? `<button data-take="${esc(c.id)}">Ta saken</button>` : ''}
        <button data-close="${esc(c.id)}">Avslutt</button>
        <button data-false="${esc(c.id)}">Falsk alarm</button></div>` : ''}
    </div>`;
  }).join('') || '<div class="case mut">Ingen saker.</div>';
}
function addLog(e) { const d = document.createElement('div'); d.textContent = `${tm(e.t)}  ${e.text}`; $('log').prepend(d); while ($('log').children.length > 300) $('log').lastChild.remove(); }

document.addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const who = $('who').value || 'Operatør';
  if (b.dataset.take) await post(`/api/alarms/${b.dataset.take}/take`, { who });
  if (b.dataset.close) { const r = prompt('Resultat', 'Kontrollert, alt i orden'); if (r !== null) await post(`/api/alarms/${b.dataset.close}/close`, { who, result: r }); }
  if (b.dataset.false) { const r = prompt('Årsak til falsk alarm', 'Dyr / vind / ansatt'); if (r !== null) await post(`/api/alarms/${b.dataset.false}/close`, { who, result: r, falseAlarm: true }); }
});
document.addEventListener('change', async ev => {
  const id = ev.target.dataset?.env; if (!id) return;
  await post(`/api/units/${id}/env`, { env: ev.target.value }); // krever admin-token
});

async function refresh() {
  try {
    const [u, c, l] = await Promise.all([get('/api/units'), get('/api/alarms'), get('/api/log')]);
    units.clear(); cases.clear(); $('log').innerHTML = '';
    u.forEach(x => units.set(x.id, x)); c.forEach(x => cases.set(x.id, x)); l.reverse().forEach(addLog);
    renderUnits(); renderCases();
  } catch (e) { $('conn').textContent = 'Feil: ' + e.message; $('conn').className = 'off'; return false; }
  return true;
}
async function connect() {
  es?.close(); seenHello = false;
  if (!await refresh()) return;
  es = new EventSource('/api/stream?token=' + encodeURIComponent($('token').value));
  es.addEventListener('hello', () => { if (seenHello) refresh(); seenHello = true; $('conn').textContent = 'Tilkoplet'; $('conn').className = 'on'; });
  es.addEventListener('unit', e => { const u = JSON.parse(e.data); delete u.publicKeyPem; units.set(u.id, u); renderUnits(); });
  es.addEventListener('case', e => { const c = JSON.parse(e.data); cases.set(c.id, c); renderCases(); });
  es.addEventListener('log', e => addLog(JSON.parse(e.data)));
  es.onerror = () => { $('conn').textContent = 'Frakoplet, prøver igjen …'; $('conn').className = 'off'; };
}
$('connect').onclick = connect;
setInterval(renderUnits, 5000);
// Ingen innebygd token. Lokalt (npm run dev) er operatør-token operator-dev.
if ($('token').value) connect();
</script>
</body>
</html>
