name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fastvare (PC-tester)
        run: make -C firmware/hovedenhet/test
      - name: Plattform og protokoll
        run: npm test
      - name: Ende til ende med simulator
        run: |
          node platform/server.ts --dev &
          sleep 2
          node simulator/sim.ts --auto
